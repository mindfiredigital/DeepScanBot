name: Sync Homebrew Tap

on:
  release:
    types: [published]
  workflow_dispatch:

# Ensure releases and manual runs don't overlap
concurrency:
  group: homebrew-tap-sync-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-tap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
        # Retain release tag for maintainability: ${{ github.event.release.tag_name }}

      - name: Setup Git
        run: |
          git config user.name "goreleaserbot"
          git config user.email "goreleaser@mindfiredigital.com"

      - name: Create homebrew-tap branch
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # Check if homebrew-tap branch exists
          if git ls-remote --heads origin homebrew-tap | grep -q homebrew-tap; then
            echo "Branch homebrew-tap exists, checking it out..."
            git checkout homebrew-tap
            git pull origin homebrew-tap
          else
            echo "Branch homebrew-tap does not exist, creating orphan branch..."
            git checkout --orphan homebrew-tap
            git rm -rf .
          fi
          
          # Create Casks directory
          mkdir -p Casks
          
          # Copy the generated cask file from the current branch
          if [ -f homebrew-tap/Casks/deepscanbot.rb ]; then
            cp homebrew-tap/Casks/deepscanbot.rb Casks/deepscanbot.rb
            echo "✅ Copied cask file from homebrew-tap/Casks/deepscanbot.rb"
          else
            echo "⚠️  Warning: Cask file not found at homebrew-tap/Casks/deepscanbot.rb"
            echo "   GoReleaser may not have generated it in the expected location."
            echo "   Checking if it exists in the root directory..."
            
            if [ -f deepscanbot.rb ]; then
              cp deepscanbot.rb Casks/deepscanbot.rb
              echo "✅ Found cask file in root directory"
            else
              echo "❌ Error: Cask file not found. Cannot proceed."
              exit 1
            fi
          fi
          
          # Validate cask file exists and is non-empty
          if [ ! -s Casks/deepscanbot.rb ]; then
            echo "❌ Error: Cask file is missing or empty. GoReleaser may not have generated it."
            exit 1
          fi
          
          # Copy README (optional, continue if not found)
          if [ -f homebrew-tap/README.md ]; then
            cp homebrew-tap/README.md README.md
            echo "✅ Copied README.md"
          else
            echo "📝 Creating default README.md for homebrew-tap"
            cat > README.md << 'READMEOF'
# DeepScanBot Homebrew Tap

This is the official Homebrew tap for DeepScanBot.

## Installation

\`\`\`bash
brew install mindfiredigital/tap/deepscanbot
\`\`\`

## Usage

\`\`\`bash
deepscanbot --help
deepscanbot doctor
\`\`\`

## More Information

- [Documentation](https://mindfiredigital.github.io/DeepScanBot/)
- [GitHub Repository](https://github.com/mindfiredigital/DeepScanBot)
- [Report Issues](https://github.com/mindfiredigital/DeepScanBot/issues)
READMEOF
          fi
          
          # Add and commit
          git add Casks/deepscanbot.rb README.md
          git diff --cached --quiet || git commit -m "chore(homebrew): publish cask for deepscanbot ${RELEASE_TAG}"
          
          # Push to homebrew-tap branch
          git push origin homebrew-tap --force

      - name: Verify cask file
        run: |
          if [ -f Casks/deepscanbot.rb ]; then
            echo "✅ Cask file created successfully"
            cat Casks/deepscanbot.rb
          else
            echo "⚠️  Warning: Cask file not found. This is expected on first release before GoReleaser runs."
          fi
